services:
  backend:
    build: .
    container_name: backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - app_network
    # Ограничение ресурсов (новый синтаксис)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5" # или "0.8", но не больше 1.0
    # Ротация логов Docker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      dev.dozzle.group: backend

networks:
  app_network:
    name: remigre_network
    driver: bridge
    external: true
